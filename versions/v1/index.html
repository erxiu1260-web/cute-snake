<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>萌萌贪吃蛇 v1</title>
<style>
  :root {
    --bg1: #ffe3ef;
    --bg2: #e3f1ff;
    --card: #fffafc;
    --ink: #6b4a5a;
    --pink: #ff8fb8;
    --pink-dark: #f2689c;
    --mint: #8fe3c4;
    --grid-a: #fff4e8;
    --grid-b: #ffeedd;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    color: var(--ink);
    background: linear-gradient(135deg, var(--bg1), var(--bg2));
    display: flex; flex-direction: column; align-items: center;
    padding: 16px; min-height: 100%;
    user-select: none;
    overflow-x: hidden;
  }
  h1 {
    margin: 4px 0 10px; font-size: clamp(24px, 6vw, 36px);
    color: var(--pink-dark); letter-spacing: 2px;
    text-shadow: 2px 2px 0 #fff, 4px 4px 0 #ffd0e2;
  }
  .wrap {
    width: min(100%, 480px);
    background: var(--card);
    border-radius: 28px;
    padding: 14px;
    box-shadow: 0 10px 0 #ffc6dc, 0 18px 40px rgba(255, 143, 184, .35);
    border: 4px solid #fff;
  }
  .hud {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px; gap: 8px; font-weight: bold;
  }
  .pill {
    background: #fff0f6; border: 3px solid #ffd0e2; border-radius: 999px;
    padding: 4px 14px; font-size: 16px; white-space: nowrap;
  }
  .stage { position: relative; }
  canvas {
    display: block; width: 100%; aspect-ratio: 1 / 1;
    border-radius: 20px; border: 4px solid #ffd0e2; background: var(--grid-a);
    touch-action: none;
  }
  .overlay {
    position: absolute; inset: 0; border-radius: 20px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(255, 245, 250, .88); text-align: center; padding: 20px;
    gap: 10px;
  }
  .overlay.hidden { display: none; }
  .overlay .big { font-size: 56px; animation: bob 1.2s ease-in-out infinite; }
  .overlay h2 { margin: 0; color: var(--pink-dark); font-size: 26px; }
  .overlay p { margin: 0; font-size: 15px; line-height: 1.6; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-8px) rotate(4deg); } }
  button {
    font: inherit; font-weight: bold; cursor: pointer;
    border: none; border-radius: 999px; color: #fff;
    background: var(--pink); padding: 10px 26px; font-size: 18px;
    box-shadow: 0 5px 0 var(--pink-dark); transition: transform .08s, box-shadow .08s;
  }
  button:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--pink-dark); }
  .speeds { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .speeds button { font-size: 15px; padding: 6px 14px; background: #ffc3da; box-shadow: 0 4px 0 #f5a3c3; color: var(--ink); }
  .speeds button.on { background: var(--mint); box-shadow: 0 4px 0 #5fc9a3; color: #2f5d4c; }
  .pad {
    display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(2, 56px);
    gap: 8px; justify-content: center; margin-top: 14px;
  }
  .pad button { padding: 0; font-size: 24px; border-radius: 18px; }
  .pad .up { grid-column: 2; grid-row: 1; }
  .pad .left { grid-column: 1; grid-row: 2; }
  .pad .down { grid-column: 2; grid-row: 2; }
  .pad .right { grid-column: 3; grid-row: 2; }
  .tips { text-align: center; font-size: 13px; opacity: .75; margin-top: 12px; }
  .ver { font-size: 12px; opacity: .6; margin-top: 10px; }
  .ver a { color: var(--pink-dark); }
  @media (hover: hover) and (pointer: fine) { .pad { display: none; } }
  @media (max-width: 420px) {
    .overlay { gap: 6px; padding: 10px; }
    .overlay .big { font-size: 36px; }
    .overlay h2 { font-size: 20px; }
    .overlay p { font-size: 13px; line-height: 1.4; }
    .speeds button { font-size: 13px; padding: 4px 10px; }
    button { font-size: 16px; padding: 8px 22px; }
  }
</style>
</head>
<body>
  <h1>🐍 萌萌贪吃蛇 🍓</h1>
  <div class="wrap">
    <div class="hud">
      <span class="pill">🍓 <span id="score">0</span></span>
      <span class="pill" id="pauseBtnWrap" style="cursor:pointer" title="暂停 (空格)">⏸️</span>
      <span class="pill">👑 <span id="best">0</span></span>
    </div>
    <div class="stage">
      <canvas id="game" width="480" height="480"></canvas>
      <div class="overlay" id="overlay">
        <div class="big" id="ovEmoji">🐍</div>
        <h2 id="ovTitle">萌萌贪吃蛇</h2>
        <p id="ovText">吃掉水果长大大～<br>别撞到自己哦！</p>
        <div class="speeds" id="speeds">
          <button data-speed="170">🐢 慢慢</button>
          <button data-speed="120" class="on">🐰 正常</button>
          <button data-speed="80">🐆 快快</button>
        </div>
        <button id="startBtn">开始！</button>
      </div>
    </div>
    <div class="pad">
      <button class="up" data-dir="up">⬆️</button>
      <button class="left" data-dir="left">⬅️</button>
      <button class="down" data-dir="down">⬇️</button>
      <button class="right" data-dir="right">➡️</button>
    </div>
    <div class="tips">方向键 / WASD 控制 · 空格暂停 · 手机可以滑动屏幕</div>
  </div>
  <div class="ver">版本 v1 · <a href="../../">所有版本</a></div>

<script>
(() => {
  const VERSION = 'v1';
  const N = 16;                 // 格子数
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const S = canvas.width / N;   // 每格像素
  const $ = id => document.getElementById(id);

  const FRUITS = [
    { emoji: '🍓', pts: 1 }, { emoji: '🍒', pts: 1 }, { emoji: '🍑', pts: 1 },
    { emoji: '🍎', pts: 1 }, { emoji: '🍇', pts: 1 }, { emoji: '🍉', pts: 1 },
  ];
  const STAR = { emoji: '⭐', pts: 3 };

  const BEST_KEY = 'cute-snake-best';
  let best = 0;
  try { best = +localStorage.getItem(BEST_KEY) || 0; } catch (e) {}
  $('best').textContent = best;

  let snake, dir, nextDirs, food, score, tickMs = 120, timer = null;
  let state = 'menu';           // menu | play | pause | over
  let particles = [];
  let lastStep = 0, blinkUntil = 0, chompUntil = 0;

  const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  const OPP = { up: 'down', down: 'up', left: 'right', right: 'left' };

  function reset() {
    snake = [{ x: 6, y: 8 }, { x: 5, y: 8 }, { x: 4, y: 8 }];
    dir = 'right'; nextDirs = [];
    score = 0; $('score').textContent = 0;
    particles = [];
    placeFood();
  }

  function placeFood() {
    const free = [];
    for (let x = 0; x < N; x++) for (let y = 0; y < N; y++)
      if (!snake.some(s => s.x === x && s.y === y)) free.push({ x, y });
    if (!free.length) { food = null; return; }
    const p = free[Math.floor(Math.random() * free.length)];
    const kind = Math.random() < 0.12 ? STAR : FRUITS[Math.floor(Math.random() * FRUITS.length)];
    food = { ...p, ...kind, born: performance.now() };
  }

  function turn(d) {
    if (state !== 'play') return;
    const last = nextDirs.length ? nextDirs[nextDirs.length - 1] : dir;
    if (d === last || d === OPP[last]) return;
    if (nextDirs.length < 3) nextDirs.push(d);
  }

  function step() {
    if (nextDirs.length) dir = nextDirs.shift();
    const [dx, dy] = DIRS[dir];
    const head = { x: snake[0].x + dx, y: snake[0].y + dy };
    // 穿墙：从另一边出来，更友好
    head.x = (head.x + N) % N; head.y = (head.y + N) % N;

    const eating = food && head.x === food.x && head.y === food.y;
    const body = eating ? snake : snake.slice(0, -1);
    if (body.some(s => s.x === head.x && s.y === head.y)) return gameOver();

    snake.unshift(head);
    if (eating) {
      score += food.pts;
      $('score').textContent = score;
      burst(food.x, food.y, food.pts > 1 ? '✨' : '💕');
      chompUntil = performance.now() + 200;
      placeFood();
      if (!food) return gameOver(true);
    } else {
      snake.pop();
    }
    lastStep = performance.now();
  }

  function burst(gx, gy, emoji) {
    const cx = (gx + .5) * S, cy = (gy + .5) * S;
    for (let i = 0; i < 7; i++) {
      const a = Math.random() * Math.PI * 2, v = 1 + Math.random() * 2.5;
      particles.push({ x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1.5, life: 1, emoji, size: 12 + Math.random() * 10 });
    }
  }

  function gameOver(win) {
    state = 'over';
    clearInterval(timer);
    const newBest = score > best;
    if (newBest) { best = score; $('best').textContent = best; try { localStorage.setItem(BEST_KEY, best); } catch (e) {} }
    showOverlay(
      win ? '🏆' : '😵',
      win ? '你吃光了所有水果！' : '哎呀，撞到啦～',
      `这次吃到 <b>${score}</b> 分${newBest && score > 0 ? '<br>🎉 新纪录！' : ''}`,
      '再来一次'
    );
  }

  function showOverlay(emoji, title, text, btn) {
    $('ovEmoji').textContent = emoji; $('ovTitle').textContent = title;
    $('ovText').innerHTML = text; $('startBtn').textContent = btn;
    $('speeds').style.display = (state === 'pause') ? 'none' : '';
    $('overlay').classList.remove('hidden');
  }

  function start() {
    if (state !== 'pause') reset();
    state = 'play';
    $('overlay').classList.add('hidden');
    clearInterval(timer);
    timer = setInterval(step, tickMs);
    lastStep = performance.now();
  }

  function togglePause() {
    if (state === 'play') {
      state = 'pause'; clearInterval(timer);
      showOverlay('😴', '休息一下～', '小蛇在打盹呢', '继续');
    } else if (state === 'pause') start();
  }

  // ---------- 绘制 ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  function drawBoard() {
    for (let x = 0; x < N; x++) for (let y = 0; y < N; y++) {
      ctx.fillStyle = (x + y) % 2 ? '#ffeedd' : '#fff6ec';
      ctx.fillRect(x * S, y * S, S, S);
    }
    // 小花点缀
    ctx.globalAlpha = .18; ctx.font = `${S * .5}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    [[2, 2], [13, 3], [3, 13], [12, 12], [8, 1], [1, 8]].forEach(([x, y]) => ctx.fillText('🌸', (x + .5) * S, (y + .5) * S));
    ctx.globalAlpha = 1;
  }

  // 身体颜色：马卡龙彩虹（粉→桃→黄→薄荷→天蓝→紫→粉…）
  function bodyColor(i) {
    const hue = (340 + i * 14) % 360;
    return `hsl(${hue}, 90%, 78%)`;
  }

  function drawSnake(now) {
    const len = snake.length;
    // 从尾巴画到头
    for (let i = len - 1; i >= 0; i--) {
      const s = snake[i];
      const shrink = i === 0 ? 0 : Math.min(i * 0.6, 5);
      const pad = 1.5 + shrink * .5;
      const x = s.x * S + pad, y = s.y * S + pad, w = S - pad * 2;
      ctx.fillStyle = bodyColor(i);
      roundRect(x, y, w, w, w * .42); ctx.fill();
      // 高光
      ctx.fillStyle = 'rgba(255,255,255,.45)';
      roundRect(x + w * .18, y + w * .14, w * .32, w * .18, w * .09); ctx.fill();
      // 身上的小圆点
      if (i > 0 && i % 3 === 0) {
        ctx.fillStyle = 'rgba(255,255,255,.55)';
        ctx.beginPath(); ctx.arc(x + w / 2, y + w / 2, w * .1, 0, Math.PI * 2); ctx.fill();
      }
    }
    drawFace(snake[0], now);
  }

  function drawFace(h, now) {
    const cx = (h.x + .5) * S, cy = (h.y + .5) * S;
    const [dx, dy] = DIRS[dir];
    const px = -dy, py = dx; // 垂直方向
    const blinking = now < blinkUntil;
    if (!blinking && Math.random() < 0.004) blinkUntil = now + 140;

    // 眼睛
    for (const side of [-1, 1]) {
      const ex = cx + dx * S * .12 + px * side * S * .2;
      const ey = cy + dy * S * .12 + py * side * S * .2;
      if (blinking || state === 'over') {
        ctx.strokeStyle = '#5a3b4a'; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
        ctx.beginPath();
        if (state === 'over') { // ×× 眼
          const r = S * .08;
          ctx.moveTo(ex - r, ey - r); ctx.lineTo(ex + r, ey + r);
          ctx.moveTo(ex + r, ey - r); ctx.lineTo(ex - r, ey + r);
        } else ctx.arc(ex, ey, S * .09, 0.15 * Math.PI, 0.85 * Math.PI);
        ctx.stroke();
      } else {
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(ex, ey, S * .14, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#4a2f3c';
        ctx.beginPath(); ctx.arc(ex + dx * S * .03, ey + dy * S * .03, S * .09, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(ex + dx * S * .03 - S * .03, ey + dy * S * .03 - S * .035, S * .035, 0, Math.PI * 2); ctx.fill();
      }
    }
    // 腮红
    ctx.fillStyle = 'rgba(255,110,150,.5)';
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.ellipse(cx - dx * S * .08 + px * side * S * .3, cy - dy * S * .08 + py * side * S * .3, S * .08, S * .055, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    // 嘴巴
    const mx = cx + dx * S * .3, my = cy + dy * S * .3;
    ctx.strokeStyle = '#5a3b4a'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    const ang = Math.atan2(dy, dx);
    if (now < chompUntil) {
      ctx.fillStyle = '#e8507f';
      ctx.beginPath(); ctx.arc(mx, my, S * .08, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(mx - dx * S * .06, my - dy * S * .06, S * .07, ang - .9, ang + .9); ctx.stroke();
    }
    // 小舌头偶尔吐一下
    if (state === 'play' && Math.floor(now / 900) % 4 === 0) {
      ctx.strokeStyle = '#ff5c8a'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(cx + dx * S * .45, cy + dy * S * .45); ctx.lineTo(cx + dx * S * .62, cy + dy * S * .62); ctx.stroke();
    }
  }

  function drawFood(now) {
    if (!food) return;
    const age = now - food.born;
    const pop = Math.min(1, age / 220);
    const bounce = Math.sin(now / 260) * S * .06;
    const scale = (0.5 + pop * 0.5) * (1 + Math.sin(now / 300) * .05);
    const cx = (food.x + .5) * S, cy = (food.y + .5) * S;
    // 影子
    ctx.fillStyle = 'rgba(200,120,150,.18)';
    ctx.beginPath(); ctx.ellipse(cx, cy + S * .36, S * .26, S * .07, 0, 0, Math.PI * 2); ctx.fill();
    if (food.pts > 1) { // 星星的光晕
      ctx.fillStyle = 'rgba(255,230,120,.35)';
      ctx.beginPath(); ctx.arc(cx, cy, S * (.55 + Math.sin(now / 150) * .06), 0, Math.PI * 2); ctx.fill();
    }
    ctx.save();
    ctx.translate(cx, cy - S * .04 + bounce); ctx.scale(scale, scale);
    ctx.font = `${S * .78}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(food.emoji, 0, 0);
    ctx.restore();
  }

  function drawParticles() {
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    particles = particles.filter(p => p.life > 0);
    for (const p of particles) {
      p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.life -= 0.025;
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.font = `${p.size}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif`;
      ctx.fillText(p.emoji, p.x, p.y);
    }
    ctx.globalAlpha = 1;
  }

  function frame(now) {
    drawBoard();
    if (snake) { drawFood(now); drawSnake(now); }
    drawParticles();
    requestAnimationFrame(frame);
  }

  // ---------- 输入 ----------
  const KEYS = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right',
  };
  window.addEventListener('keydown', e => {
    if (KEYS[e.key]) { e.preventDefault(); turn(KEYS[e.key]); }
    else if (e.key === ' ') {
      e.preventDefault();
      if (state === 'play' || state === 'pause') togglePause(); else start();
    } else if (e.key === 'Enter' && state !== 'play') start();
  });

  let touch = null;
  canvas.addEventListener('touchstart', e => { const t = e.touches[0]; touch = { x: t.clientX, y: t.clientY }; }, { passive: true });
  canvas.addEventListener('touchmove', e => {
    if (!touch) return;
    e.preventDefault();
    const t = e.touches[0], dx = t.clientX - touch.x, dy = t.clientY - touch.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    touch = { x: t.clientX, y: t.clientY };
  }, { passive: false });
  canvas.addEventListener('touchend', () => touch = null);

  document.querySelectorAll('.pad button').forEach(b =>
    b.addEventListener('pointerdown', e => { e.preventDefault(); turn(b.dataset.dir); }));

  document.querySelectorAll('#speeds button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('#speeds button').forEach(x => x.classList.remove('on'));
    b.classList.add('on'); tickMs = +b.dataset.speed;
  }));

  $('startBtn').addEventListener('click', start);
  $('pauseBtnWrap').addEventListener('click', togglePause);

  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
